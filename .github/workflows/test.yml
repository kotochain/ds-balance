name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 密钥检查需要完整历史

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # 自测全部走本地 mock 接口，不需要任何密钥，也不消耗真实额度
      - name: 运行自测
        run: node tests/self-test.mjs

      - name: 检查语法
        run: |
          node --check ds-balance.mjs
          node --check tests/self-test.mjs
          node --check tests/css-audit.mjs
          node --check tests/check-secrets.mjs

  secrets:
    # 独立成一个 job：一旦有密钥混进来，这里必须红，不能和普通测试混在一起
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 扫描仓库文件
        run: node tests/check-secrets.mjs

      - name: 扫描全部提交历史
        run: node tests/check-secrets.mjs --history

      # git add 会立刻写入对象库，提交被拦也会留下游离副本，必须单独查
      - name: 扫描对象库（含游离对象）
        run: node tests/check-secrets.mjs --objects

      - name: 兜底确认本机数据未入库
        run: |
          if git ls-files | grep -qE '(^|/)(data/|keys\.json$|history\.jsonl$|\.env)'; then
            echo "::error::检测到密钥或记录文件被提交，请从版本库移除"
            exit 1
          fi
          echo "OK：版本库里没有密钥或记录文件"
